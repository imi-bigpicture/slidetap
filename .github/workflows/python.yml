name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: slidetap-app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "slidetap-app/uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras

      # Hard gates: the codebase is lint- and format-clean today.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Typos
        run: uv run typos

      # Non-blocking for now: pre-existing type errors remain.
      # Drop `continue-on-error` once `uv run pyright` is clean.
      - name: Pyright
        run: uv run pyright
        continue-on-error: true

      # The whole suite, integration included: the integration tests run
      # in-process (SQLite in a tmpdir, Procrastinate's InMemoryConnector,
      # FastAPI's TestClient) and need no external services.
      - name: Tests
        run: uv run pytest
