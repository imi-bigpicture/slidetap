version: 2
updates:
  # Documentation site (Jekyll / Ruby gems)
  - package-ecosystem: bundler
    directory: /docs
    schedule:
      interval: daily
    cooldown:
      default-days: 14
    allow:
      - dependency-type: direct

  # Python backend (uv workspace; apps/example shares the root uv.lock)
  - package-ecosystem: uv
    directory: /slidetap-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]

  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: /slidetap-client
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # typescript-eslint does not support TypeScript 7 yet, and without it the
    # client cannot be linted. Lift once a typescript-eslint release does.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      frontend:
        patterns: ["*"]

  # Base images of the application images
  - package-ecosystem: docker
    directories:
      - /slidetap-app/dockerfiles
      - /slidetap-client/dockerfiles
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]

  # Images of the example deployment
  - package-ecosystem: docker-compose
    directory: /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
