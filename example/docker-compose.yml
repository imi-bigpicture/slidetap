services:
  dbservice:
    # Pinned to an exact tag; Dependabot's docker-compose ecosystem bumps it.
    image: postgres:17.11-trixie
    volumes:
      - slidetap_postgres_data:/var/lib/postgresql/data/
    # Credentials come from .env, written by prepare-example-config.py.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run prepare-example-config.py to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run prepare-example-config.py to create .env}
      POSTGRES_DB: ${POSTGRES_DB:?run prepare-example-config.py to create .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbmigrate:
    env_file: .env
    environment:
      SLIDETAP_STORAGE: /storage
      SLIDETAP_DBURI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dbservice:5432/${POSTGRES_DB}
      # The package whose container module the mapper set-up creates its
      # container from.
      SLIDETAP_TASK_APP: ${SLIDETAP_TASK_APP}
    build:
      context: ../slidetap-app
      dockerfile: dockerfiles/taskservice.Dockerfile
    # The mapper set-up reads config.yaml from the storage.
    volumes:
      - ${SLIDETAP_STORAGE}:/storage:rw
    command: >
      sh -c "slidetap-db upgrade &&
             slidetap-task-init-schema &&
             slidetap-mappers set-up"
    restart: "no"
    depends_on:
      dbservice:
        condition: service_healthy

  taskservice:
    env_file: .env
    environment:
      SLIDETAP_STORAGE: /storage
      SLIDETAP_DBURI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dbservice:5432/${POSTGRES_DB}
      SLIDETAP_WEBAPP_URL: https://${SLIDETAP_SERVERNAME}:${SLIDETAP_PORT}
    build:
      context: ../slidetap-app
      dockerfile: dockerfiles/taskservice.Dockerfile
    volumes:
      - ${SLIDETAP_STORAGE}:/storage:rw
    depends_on:
      dbmigrate:
        condition: service_completed_successfully

  appservice:
    env_file: .env
    environment:
      SLIDETAP_STORAGE: /storage
      SLIDETAP_DBURI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dbservice:5432/${POSTGRES_DB}
      SLIDETAP_WEBAPP_URL: https://${SLIDETAP_SERVERNAME}:${SLIDETAP_PORT}
      SLIDETAP_APIPORT: ${SLIDETAP_APIPORT}
    build:
      context: ../slidetap-app
      dockerfile: dockerfiles/webservice.Dockerfile
    volumes:
      - ${SLIDETAP_STORAGE}:/storage:rw
    depends_on:
      dbmigrate:
        condition: service_completed_successfully

  webserver:
    # Only what the nginx template needs, so the database password and secret
    # key stay out of the internet-facing container.
    environment:
      SLIDETAP_SERVERNAME: ${SLIDETAP_SERVERNAME}
      SLIDETAP_PORT: ${SLIDETAP_PORT}
      SLIDETAP_APIPORT: ${SLIDETAP_APIPORT}
      SLIDETAP_SSL_CERTIFICATE: ${SLIDETAP_SSL_CERTIFICATE}
      SLIDETAP_SSL_CERTIFICATE_KEY: ${SLIDETAP_SSL_CERTIFICATE_KEY}
    build:
      context: ../slidetap-client
      dockerfile: dockerfiles/webserver.Dockerfile
    ports:
      - ${SLIDETAP_PORT}:${SLIDETAP_PORT}
    volumes:
      - ${SLIDETAP_SSL_CERTIFICATE_FOLDER}:/certs:ro
    depends_on:
      appservice:
        condition: service_started

volumes:
  slidetap_postgres_data:
