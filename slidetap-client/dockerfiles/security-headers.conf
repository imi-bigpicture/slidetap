# Response headers for every location. nginx only inherits add_header from the
# enclosing block when a location defines none of its own, so a location that
# adds a header must include this file again.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Enforced: no framing, plugins or base-URL rewriting.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

# Report-only until verified against a running deployment: violations are
# logged in the browser console without blocking. Emotion (MUI) injects inline
# styles, and OpenSeadragon draws tiles fetched from /api as blob: images.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
