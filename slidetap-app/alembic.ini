# Alembic configuration for SlideTap.
#
# This file is for development commands, run from this directory:
# `uv run alembic revision --autogenerate -m "..."`.
#
# Deployments do not use it: the `dbmigrate` compose service runs
# `slidetap-db upgrade` (slidetap/migrations/cli.py), which builds the same
# configuration in code and therefore needs no file on the working directory.
# Migrations are applied explicitly by that service, never on app startup.
#
# The script_location points inside the package so migration scripts ship with
# the distribution and are reachable both ways.
#
# sqlalchemy.url is intentionally blank — env.py reads SLIDETAP_DBURI from the
# environment so the CLI and the running app share one source of truth.

[alembic]
script_location = slidetap:migrations
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Optional: run black on generated migrations. Uncomment to enable.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
